[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ams"
version = "0.1.0"
description = "AMS — Assistente de Manutenção Segura: projeto de referência da Disciplina 1 (CEDAGI/UTFPR)"
readme = "README.md"
requires-python = ">=3.12"
# As dependências vivem no requirements.txt com versões fixadas — é ele a
# fonte da verdade instalada pelo setup. Aqui não repetimos para não criar
# duas listas que divergem.
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jupyterlab==4.6.3",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "polars==1.44.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.4",
    "pytest==9.1.1",
    "python-dotenv==1.2.3",
    "ruff==0.16.4",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: o `;` no fim da linha é o idioma de suprimir output da célula.
"*.ipynb" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
